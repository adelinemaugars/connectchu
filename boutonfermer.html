<!-- Bouton Retour -->
<button onclick="goBack()"
  style="display:flex;align-items:center;gap:8px;
         padding:12px 24px;font-size:16px;cursor:pointer;">
  ← Retour
</button>

<script>
function goBack() {

  // 1. Priorité : historique du navigateur
  if (history.length > 1) {
    history.back();
    return;
  }

  // 2. Ferme la fenêtre si ouverte par script
  if (window.opener) {
    window.close();
    return;
  }

  // 3. Chrome mobile (PWA / TWA / Custom Tab)
  // Tente de fermer via l'API Android
  if (typeof Android !== 'undefined' && Android.goBack) {
    Android.goBack();
    return;
  }

  // 4. Repli final
  window.close();
}
</script>
